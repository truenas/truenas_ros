[package]
name = "truenas_ros"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Idiomatic Rust bindings for modern Linux filesystem/mount syscalls, ACLs, and related utilities (the Rust equivalent of truenas_pyos)."
categories = ["os::unix-apis", "filesystem"]
keywords = ["linux", "syscall", "mount", "acl", "truenas"]

[lints.rust]
# `loom` is a dev-only cfg enabled via RUSTFLAGS="--cfg loom" for the SQ/CQ
# memory-ordering model in src/uring/ring.rs. Register it so the crate's
# deny(unexpected_cfgs) accepts it — the lint checks cfg *names* even when unset,
# so `#[cfg(loom)]` in source must be declared regardless of the active build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
libc = { version = "0.2.155", features = ["extra_traits"] }
bitflags = "2.6"
# HTTP/1.1 request-head tokenizer for the `http` codec: sans-io, zero-dep,
# no runtime opinions (the same parser hyper uses internally). The rest of
# the codec — framing, keep-alive, serialization, hardening — is ours.
httparse = { version = "1.10", optional = true }

# loom (a concurrency permutation checker) backs the SQ/CQ ordering test in
# src/uring/ring.rs. Pulled ONLY under `--cfg loom`, so normal builds keep the
# libc+bitflags charter untouched.
#   Run: RUSTFLAGS="--cfg loom" cargo test --lib --features uring-fs sq_cq
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[features]
# Default enables the implemented subsystems; more join as phases land.
default = [
    "sync-fs",
    "xattr",
    "mount",
    "acl",
    "fhandle",
    "fsiter",
    "idmap",
    "shutil",
    "configfile",
    "audit",
]

# Blocking filesystem bindings (the `sync_fs` umbrella): `sync-fs` is the base
# syscall layer at the umbrella root; each sibling feature gates one `sync_fs::`
# submodule. `mount` + `idmap` (the userns builder feeding idmapped mounts) form
# the `mount` umbrella.
sync-fs = []
xattr = []
mount = ["sync-fs"]
fhandle = ["sync-fs"]
acl = ["xattr"]
fsiter = ["sync-fs", "mount"]
idmap = []
shutil = ["fsiter", "xattr"]
configfile = ["sync-fs"]
# Kernel audit records over `NETLINK_AUDIT` (`src/audit`): the libaudit
# replacement — a PAM-shaped event description plus a synchronous send, so a
# service's own events land in audit.log next to PAM's. Standalone (its own
# socket, no `sync-fs` vocabulary) and dependency-free, so it rides in
# `default` like `configfile`. Deliberately ships no queue or thread: the send
# can block on kernel-audit backpressure, and shedding that load is the
# embedding application's policy — see the module docs.
audit = []
# The shared io_uring engine (`src/uring`): raw UAPI, ring, SQE staging,
# wake, slot generations, the user_data codec. Internal — enabled transitively
# by the domains built on it (the net stack today, uring-fs next); not a
# public API surface.
uring = []
# io_uring stream networking. `net-core` is the stream reactor + vocab over
# the engine; `net-server` (inbound) and `net-client` (outbound) are the
# roles, each pulling in the core. Kept out of `default` (io_uring-runtime-
# dependent, use-case-specific); opt in via a role feature or `full`.
net-core = ["uring"]
net-server = ["net-core"]
net-client = ["net-core"]
# HTTP/1.1 codec over the `net::server` protocol seam (`src/http`): a framer
# + request/response vocabulary, not a server — the reactor stays in charge.
# Head tokenizing is `httparse`; framing, 100-continue, keep-alive,
# serialization, and smuggling hardening are implemented here.
http = ["net-server", "dep:httparse"]
# The io_uring filesystem reactor: files opened into a fixed-descriptor
# pool, every op stamped with a registered personality (kernel-enforced
# per-op identity), anchored path resolution. Off by default and absent from
# `full` — it depends on the io_uring runtime, and (unlike the net roles) on a
# credential broker forked before the daemon starts threads, so it is opt-in
# rather than something `full` turns on underneath a consumer. Depends on
# `sync-fs` for the shared OpenHow/ResolveFlag vocabulary; combine with
# `net-server` for the in-server reactor (`ServerConfig::fs_files`).
uring-fs = ["uring", "sync-fs", "xattr"]
# Internal: exposes pure framing decisions to the fuzz crate (`fuzz/`) — the
# net stack's `frame_step`, and the `http` codec's framer/head/chunked entry
# points (`http::fuzz`). Not for consumers; implies the modules those live in.
__fuzz = ["net-server", "http"]
full = [
    "sync-fs",
    "xattr",
    "mount",
    "fhandle",
    "acl",
    "fsiter",
    "idmap",
    "shutil",
    "configfile",
    "audit",
    "net-server",
    "net-client",
    "http",
]

[dev-dependencies]
tempfile = "3"
# net splice tests only: a raw `pipe()` as the splice target. `libc` is
# already the library's normal dependency, so this adds no new footprint.
libc = { version = "0.2.155", features = ["extra_traits"] }
# kTLS integration test only: a real TLS client/server around the kernel-TLS
# transport. The library itself pulls no TLS crate — the consumer brings one.
openssl = "0.10"
openssl-sys = "0.9"
foreign-types = "0.3" # ForeignType::as_ptr for the raw SSL_accept BIO dance

[[test]]
name = "test"
path = "test/test.rs"

[[test]]
name = "coverage"
path = "test/coverage.rs"

# Privileged, ZFS-backed tests (real NFSv4/POSIX ACLs, snapshot detection).
# Skip automatically when no ACL-typed ZFS dataset is available; provisioned in
# CI by .github/workflows/scripts/setup-test-zfs.sh.
[[test]]
name = "zfs"
path = "test/zfs.rs"

# Differential tests against the real Python `configparser` (byte-for-byte and
# behavior parity). Skip automatically when `python3` is unavailable.
[[test]]
name = "configparser_compat"
path = "test/configparser_compat.rs"

# Kernel audit. Sends real records over NETLINK_AUDIT; skips automatically when
# the socket cannot be opened (sandbox/old kernel) and tolerates a missing
# CAP_AUDIT_WRITE (the kernel reports that as a benign "unavailable", not an
# error). Set TRUENAS_ROS_REQUIRE_AUDIT=1 to make either a hard failure.
[[test]]
name = "audit"
path = "test/audit.rs"

# io_uring stream server. Live loopback tests; skip automatically when io_uring
# is unavailable (sandbox/old kernel). Set TRUENAS_ROS_REQUIRE_IO_URING=1 to
# make that a hard failure instead.
[[test]]
name = "net_server"
path = "test/net_server.rs"

# io_uring stream client. Live loopback echo against an in-process net::server;
# skips automatically when io_uring is unavailable (sandbox/old kernel). Set
# TRUENAS_ROS_REQUIRE_IO_URING=1 to make that a hard failure instead.
[[test]]
name = "net_client"
path = "test/net_client.rs"

# HTTP codec through the real reactor. Live loopback tests (keep-alive, the
# 100-continue interim flush ordering, chunked bodies + trailers, farewell-
# then-FIN semantics, the owned-body handoff); skip automatically when
# io_uring is unavailable (sandbox/old kernel). Set
# TRUENAS_ROS_REQUIRE_IO_URING=1 to make that a hard failure instead.
[[test]]
name = "http_live"
path = "test/http_live.rs"

# io_uring fs reactor. Live tests against a tempdir (opens, vectored I/O,
# personality registration, fixed-slot lifecycle); skip automatically when
# io_uring is unavailable (sandbox/old kernel). Set
# TRUENAS_ROS_REQUIRE_IO_URING=1 to make that a hard failure instead.
[[test]]
name = "uring_fs"
path = "test/uring_fs.rs"

# Consumer-facing example: the `net::server` handlers (esp. `accept`) as
# standalone functions. Built only when the `net-server` feature is on.
[[example]]
name = "tcp_accept_fn"
required-features = ["net-server"]

# Consumer-facing example: offloading the body handler to a worker pool via
# `Response::Defer` (the library ships no pool). Feature-gated like above.
[[example]]
name = "tcp_offload"
required-features = ["net-server"]

# Consumer-facing example: multi-core via SO_REUSEPORT — N independent
# single-ring servers (one per thread) sharing one address.
[[example]]
name = "tcp_multicore"
required-features = ["net-server"]

# Consumer-facing example: detaching a connection's socket fd to a worker for a
# blocking op on the socket (e.g. a ZFS send/recv ioctl), then resume or close.
[[example]]
name = "tcp_detach"
required-features = ["net-server"]

# Consumer-facing example: the outbound `net::client` — fan out connections,
# batch framed requests, and pump `next_event` — against an in-process
# `net::server` echo (so it runs standalone). Needs both roles.
[[example]]
name = "tcp_client"
required-features = ["net-server", "net-client"]

# Consumer-facing example: the `http` codec on the reactor — a minimal
# HTTP/1.1 endpoint exercising keep-alive, bodies, and 100-continue.
[[example]]
name = "http_hello"
required-features = ["http"]
