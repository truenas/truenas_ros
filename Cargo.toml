[package]
name = "truenas_ros"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Idiomatic Rust bindings for modern Linux filesystem/mount syscalls, ACLs, and related utilities (the Rust equivalent of truenas_pyos)."
categories = ["os::unix-apis", "filesystem"]
keywords = ["linux", "syscall", "mount", "acl", "truenas"]

[lints.rust]
# `loom` is a dev-only cfg enabled via RUSTFLAGS="--cfg loom" for the SQ/CQ
# memory-ordering model in src/uring/ring.rs. Register it so the crate's
# deny(unexpected_cfgs) accepts it — the lint checks cfg *names* even when unset,
# so `#[cfg(loom)]` in source must be declared regardless of the active build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
libc = { version = "0.2.155", features = ["extra_traits"] }
bitflags = "2.6"
# tokio backs the `rt-*` features only (async completion for the fs reactor;
# later phases add the zero-copy bridges and the kTLS stream). Optional, so the
# libc+bitflags charter holds for every other build. Version floor 1.43 (an LTS
# line); the exact pin lives in Cargo.lock. No default features — the runtime
# itself is the consumer's; the library needs only these primitives.
tokio = { version = "1.43", optional = true, default-features = false, features = [
    "net",     # AsyncFd + socket types for the bridges/KtlsStream
    "sync",    # oneshot completion delivery + Semaphore backpressure
    "time",    # bridge/watchdog timeouts
    "rt",      # spawn_blocking for the TLS handshake helpers
    "io-util", # AsyncRead/AsyncWrite plumbing for KtlsStream/FrameReader
    "macros",  # select! in the serve() accept/drain loop
] }
# OpenSSL backs ONLY the `rt-tls-openssl` handshake helpers. The core
# `KtlsStream` is TLS-crate-free: a consumer brings its own handshake and
# hands over an fd with kernel TLS already engaged. `openssl-sys` +
# `foreign-types` are the raw `BIO_new_socket`/`SSL_accept` dance those
# helpers need — OpenSSL only installs kTLS when it handshakes over a real
# socket BIO (a Rust-stream BIO would fall back to userspace TLS records).
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
foreign-types = { version = "0.3", optional = true }
# The WS example only (`__ws-example`): the point of the tokio pivot is that
# protocol layers like this come from the ecosystem, unowned.
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }

# loom (a concurrency permutation checker) backs the SQ/CQ ordering test in
# src/uring/ring.rs. Pulled ONLY under `--cfg loom`, so normal builds keep the
# libc+bitflags charter untouched.
#   Run: RUSTFLAGS="--cfg loom" cargo test --lib --features async-fs sq_cq
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[features]
# Default enables the implemented subsystems; more join as phases land.
default = [
    "sync-fs",
    "xattr",
    "mount",
    "acl",
    "fhandle",
    "fsiter",
    "idmap",
    "shutil",
    "configfile",
]

# Blocking filesystem bindings (the `sync_fs` umbrella): `sync-fs` is the base
# syscall layer at the umbrella root; each sibling feature gates one `sync_fs::`
# submodule. `mount` + `idmap` (the userns builder feeding idmapped mounts) form
# the `mount` umbrella.
sync-fs = []
xattr = []
mount = ["sync-fs"]
fhandle = ["sync-fs"]
acl = ["xattr"]
fsiter = ["sync-fs", "mount"]
idmap = []
shutil = ["fsiter", "xattr"]
configfile = ["sync-fs"]
# The shared io_uring engine (`src/uring`): raw UAPI, ring, SQE staging,
# wake, slot generations, the user_data codec. Internal — enabled transitively
# by the domains built on it (the fs reactor and the tokio-hybrid runtime);
# not a public API surface.
uring = []
# The io_uring filesystem reactor: files opened into a fixed-descriptor
# pool, every op stamped with a registered personality (kernel-enforced
# per-op identity), anchored path resolution. Off by default and absent from
# `full` — it depends on the io_uring runtime and on a credential broker
# forked before the daemon starts threads, so it is opt-in rather than
# something `full` turns on underneath a consumer. Depends on `sync-fs` for
# the shared OpenHow/ResolveFlag vocabulary; `rt-tokio` builds on it.
async-fs = ["uring", "sync-fs"]
# The tokio-hybrid runtime: sockets live on the consumer's multi-threaded
# tokio; the io_uring engine serves as a single process-wide FILE reactor.
# `rt-tokio` adds the async completion path (`FsRt`/`FsRuntime`) over the same
# loop the blocking `FsHandle` uses; later phases add the zero-copy BufPool and
# the socket↔file splice/SEND_ZC bridges. Off by default and absent from `full`
# for the same reason as `async-fs` (runtime- and broker-dependent, opt-in).
rt-tokio = ["dep:tokio", "async-fs", "framing"]
# The pure framing decision core (`frame_step`, `Framing`, the length-prefix
# framer) — dependency-free, transport-agnostic; consumed by the rt
# FrameReader and the fuzz harnesses.
framing = []
# Kernel-TLS stream (`KtlsStream`: AsyncRead/AsyncWrite over an fd whose TLS
# ULP + keys are already installed). Brings no TLS crate.
rt-ktls = ["rt-tokio"]
# OpenSSL convenience handshake helpers (SSL_OP_ENABLE_KTLS + spawn_blocking)
# producing an engaged `KtlsStream`. The only feature linking openssl into the
# library proper (it is otherwise a dev-dependency of the kTLS tests).
rt-tls-openssl = [
    "rt-ktls",
    "dep:openssl",
    "dep:openssl-sys",
    "dep:foreign-types",
]
# Internal: what the rt integration tests need beyond `rt-tokio` — a real
# multi-thread tokio runtime to drive the loop from many worker threads. A
# private feature (not for consumers, who bring their own runtime) so the
# library's own tokio stays primitive-only; `--all-features` (CI) enables it.
__rt-test = ["rt-tls-openssl", "tokio/rt-multi-thread"]
# Internal: the WebSocket layering example (`examples/rt_ws_echo.rs`) —
# proves tokio-tungstenite sits directly on the crate's streams. The
# tungstenite dependency exists only for it.
__ws-example = [
    "__rt-test",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "tokio/signal", # ctrl-c shutdown in the example binary only
]
# Internal: the feature set the fuzz crate (`fuzz/`) builds against — the
# hoisted pure framing core. Not for consumers.
__fuzz = ["framing"]
full = [
    "sync-fs",
    "xattr",
    "mount",
    "fhandle",
    "acl",
    "fsiter",
    "idmap",
    "shutil",
    "configfile",
    "framing",
]

[dev-dependencies]
tempfile = "3"
# net splice tests only: a raw `pipe()` as the splice target. `libc` is
# already the library's normal dependency, so this adds no new footprint.
libc = { version = "0.2.155", features = ["extra_traits"] }
# NOTE: tokio (and openssl) are deliberately NOT dev-dependencies. Dev-deps are
# unconditional, and the loom CI step (RUSTFLAGS="--cfg loom") applies its
# cfg to every crate in the graph — tokio does not build under an external
# `--cfg loom`. The rt tests reach tokio and openssl through the library's
# own optional dependencies (test target `rt_fs`, required-features
# `__rt-test`).

[[test]]
name = "test"
path = "test/test.rs"

[[test]]
name = "coverage"
path = "test/coverage.rs"

# Privileged, ZFS-backed tests (real NFSv4/POSIX ACLs, snapshot detection).
# Skip automatically when no ACL-typed ZFS dataset is available; provisioned in
# CI by .github/workflows/scripts/setup-test-zfs.sh.
[[test]]
name = "zfs"
path = "test/zfs.rs"

# Differential tests against the real Python `configparser` (byte-for-byte and
# behavior parity). Skip automatically when `python3` is unavailable.
[[test]]
name = "configparser_compat"
path = "test/configparser_compat.rs"


# io_uring fs reactor. Live tests against a tempdir (opens, vectored I/O,
# personality registration, fixed-slot lifecycle); skip automatically when
# io_uring is unavailable (sandbox/old kernel). Set
# TRUENAS_ROS_REQUIRE_IO_URING=1 to make that a hard failure instead.
[[test]]
name = "async_fs"
path = "test/async_fs.rs"

# The tokio-hybrid runtime: async fs ops from multi-thread tokio tasks over
# the same loop the blocking handles use. Skips like async_fs when io_uring
# is unavailable. `required-features` (rather than an in-file cfg) because
# the test uses the library's OPTIONAL tokio dependency — without the
# feature the target must not build at all.
[[test]]
name = "rt_fs"
path = "test/rt_fs.rs"
required-features = ["__rt-test"]

# The tokio-hybrid layering proof: tungstenite (WebSocket) from the
# ecosystem over a served TcpStream, journaling through the fs ring.
[[example]]
name = "rt_ws_echo"
required-features = ["__ws-example"]





