# Fuzz harnesses for every decoder in the library that eats bytes it did not
# write: the net stack's framing, the http codec, the NFSv4/POSIX.1e ACL wire
# formats, the INI parser, the statmount reply, the file-handle and resume-
# cursor codecs, the audit record encoder, the path checks, and the credential
# broker's request header. A separate, unpublished dev-only crate (like the
# kTLS test deps): it does NOT touch the library's libc+bitflags charter or its
# 1.97 MSRV. Run with a nightly toolchain:
#   cargo +nightly fuzz run framer_length_prefix
#   cargo +nightly fuzz run tree_cursor -- -dict=dicts/tree_cursor.dict
# No corpus is checked in; regressions live in the library's own tests. See
# the Fuzzing section of the top-level README for why.
[package]
name = "truenas_ros-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `broker_request` and `audit_ack` assert against the same `errno`/`EPERM`
# constants the code under test uses. Already the library's own dependency, so
# this adds no footprint.
libc = "0.2.155"

[dependencies.truenas_ros]
path = ".."
# `__fuzz` implies every module the targets drive and exposes the four
# internals that are not already public: `frame_step`, the http codec's
# framer/head/chunked (`http::fuzz`), the statmount reply parser
# (`mount::fuzz`), the listing comparator (`uring_fs::query_dir::fuzz`), the
# broker request decoder and `Leaf::to_cstring` (`uring_fs::fuzz`), and the
# netlink ack decoder (`audit::fuzz`).
features = ["__fuzz"]

# Self-rooted so it never gets pulled into a parent workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "framer_length_prefix"
path = "fuzz_targets/framer_length_prefix.rs"
test = false
doc = false
bench = false

