name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Some failures only ever reproduce on the runner, and a bare `panicked at
# file:line` with no frames is not enough to chase one from a log.
env:
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt + clippy + test (unprivileged)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The configparser differential tests spawn python3; guarantee it is present
    # so they run for real here rather than skipping.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup component add clippy rustfmt
        rustup default stable

    # `~/.cargo/bin` is in the cache for cargo-fuzz: installing it is a
    # from-source build of a whole binary, which would otherwise be the slowest
    # step in this job on every run.
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          target
          fuzz/target
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

    # The fuzz crate is its own workspace, so `--all` here does not reach it and
    # a stray `cargo fmt` run from inside it would silently reflow every target
    # to rustfmt's 100-column default. Check it explicitly.
    - name: rustfmt
      run: |
        cargo fmt --all --check
        cargo fmt --all --check --manifest-path fuzz/Cargo.toml

    - name: clippy
      run: cargo clippy --all-features --all-targets -- -D warnings

    # The net (io_uring) tests skip themselves when a ring can't be created. We
    # do NOT want that to pass silently as green, so force them to run below —
    # but first fail fast and legibly if this runner has io_uring restricted,
    # so a red is clearly "runner can't do io_uring" and not a net-code bug.
    # (io_uring_disabled: 0 = on for everyone, 1 = unprivileged blocked, 2 =
    # off; an absent sysctl predates the knob and means io_uring is on.)
    - name: Verify io_uring is available
      run: |
        disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)
        if [ "$disabled" != "0" ]; then
          echo "::error::io_uring restricted on this runner (io_uring_disabled=$disabled); net tests cannot run here"
          exit 1
        fi
        echo "io_uring available (io_uring_disabled=$disabled)"
        echo "kernel=$(uname -r) uid=$(id -u) RLIMIT_MEMLOCK=$(ulimit -l) KiB"

    # The ZFS-backed and privileged tests skip automatically here (no datasets,
    # unprivileged); the QEMU VM job exercises them for real. Two otherwise-
    # silent skips are turned into hard failures: the configparser differential
    # tests (REQUIRE_PYTHON) and the net server/client tests (REQUIRE_IO_URING,
    # backed by the ring probe above that guarantees they can actually run).
    #
    # Two families are deliberately NOT forced here, both because this runner
    # cannot serve them and the QEMU job can:
    #
    # kTLS - this runner's kernel has the tls ULP, but Ubuntu builds OpenSSL
    # 3.0 without enable-ktls, so libssl can never install kTLS on a socket and
    # the suites' loopback engagement probe skips those tests.
    #
    # xattrs - the runner's scratch filesystem is ext4, which holds an xattr
    # value in the inode's spare room or one filesystem block and answers
    # ENOSPC above that (fs/ext4/xattr.c), so the large-value fixtures cannot
    # run here whatever the crate does. The appliance runs on ZFS, which takes
    # them without complaint, and that is where the gate belongs.
    #
    # The QEMU job (Trixie userspace, OpenSSL 3.2+ with ktls, real datasets)
    # arms TRUENAS_ROS_REQUIRE_KTLS and TRUENAS_ROS_REQUIRE_XATTRS and runs
    # both families for real.
    # `--no-fail-fast`, so one target's failure does not hide every later
    # target's. Without it cargo stops at the first failing binary and the
    # log names one failure where there may be several - which is exactly
    # the information a red lane is for.
    - name: test
      run: cargo test --all-features --no-fail-fast
      env:
        TRUENAS_ROS_REQUIRE_PYTHON: "1"
        TRUENAS_ROS_REQUIRE_IO_URING: "1"
        TRUENAS_ROS_REQUIRE_BTIME: "1"

    # The build that ships: `debug_assert` guards vanish here, so the release
    # lane is what covers each guard's graceful `if` half (the `should_panic`
    # tests cover the assert half and are `#[cfg(debug_assertions)]`).
    - name: test (release)
      run: cargo test --release --all-features --no-fail-fast
      env:
        TRUENAS_ROS_REQUIRE_PYTHON: "1"
        TRUENAS_ROS_REQUIRE_IO_URING: "1"
        TRUENAS_ROS_REQUIRE_BTIME: "1"

    # The concurrency models are gated on `#[cfg(loom)]`: loom substitutes std's
    # atomics/locks/UnsafeCell with its own permutation-checking versions, so they
    # cannot ride along with the `cargo test` above — they need their own build
    # under `--cfg loom` and are invisible to every other step (including clippy).
    # Every model lives in a `loom_tests` module, so one name filter selects them
    # all. Each is deliberately tiny (loom is exhaustive, and its MAX_THREADS is 5
    # including the main thread); the heavier ones run under a preemption bound,
    # which their doc comments call out as making them bounded rather than
    # exhaustive proofs. cfg(loom) is registered in Cargo.toml's [lints.rust].
    #
    # One invocation, at --all-features: it used to be three because
    # `--cfg loom` + `net-client` did not compile (a `std::sync::Arc` where
    # the engine hands out loom's), so the models had to be run in the
    # feature subsets that avoided it - by accident, not by design.
    #
    # The count is asserted, not the exit code. A libtest filter that matches
    # nothing exits 0, so a mistyped `--cfg looom` would read as a green lane.
    #
    # The filter selects by PATH, and every model lives in a module named
    # `loom_tests`, so the module segment is what matches and a model's own
    # `loom_` prefix does not change the count. Keep the prefix anyway:
    # `CLAUDE.md` states it, and it is what makes the name alone say whether
    # a `loom_tests` entry is a model. The count is a tripwire on the total,
    # not a census - moving a model to a plain `tests` module drops it out
    # of the filter and reddens the lane, which is the intended reaction.
    #
    # Exact, not a lower bound: `-lt` against a constant one below the true
    # count is the one failure this assertion exists to prevent. At
    # MODELS=23 against 24 running, silencing any single model left the lane
    # green - measured, `#[ignore]` on one gave `23 passed; 1 ignored`, and
    # `23 -lt 23` is false. Bump MODELS when you add one; that is the point.
    - name: loom (concurrency models)
      env:
        MODELS: "24"
      run: |
        .github/workflows/scripts/counted-cargo-test.sh "$MODELS" "loom" -- \
          env RUSTFLAGS="--cfg loom" \
          cargo test --lib --all-features loom_
    # The fuzz crate is self-rooted (its own workspace), so nothing above ever
    # compiles it — a target could bit-rot against an API change and no one
    # would know until someone ran a campaign by hand. Building every target is
    # what this step is really for.
    #
    # The short run after it is a smoke test, not a regression suite: ten
    # seconds is enough to catch a harness that builds but aborts immediately
    # (a bad assertion, a panic on the empty input), and nothing more. It
    # explores a different slice each time and is not expected to reproduce
    # anything in particular — regressions belong in `cargo test`, where a
    # failure names the invariant instead of printing a hex blob. Real
    # bug-finding wants a campaign, not a CI job.
    #
    # A target with tracked seeds starts from them; the rest start from empty.
    - name: fuzz (build + smoke)
      run: |
        rustup toolchain install nightly --profile minimal
        command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
        cd fuzz
        cargo +nightly fuzz build
        # The census. `cargo fuzz list` reads the `[[bin]]` table, so a
        # target added under `fuzz_targets/` and never registered there is
        # built by nothing, smoked by nothing and fmt-checked by nothing -
        # it just sits in the tree looking covered. Compare the two lists.
        # shellcheck disable=SC2012
        ls fuzz_targets/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
          | sort > /tmp/fuzz-on-disk
        cargo +nightly fuzz list | sort > /tmp/fuzz-registered
        if ! diff -u /tmp/fuzz-on-disk /tmp/fuzz-registered; then
          echo "::error::fuzz target census mismatch (- on disk, + registered)"
          exit 1
        fi
        for t in $(cargo +nightly fuzz list); do
          # Targets share a dictionary where they share a wire format.
          dict=dicts/$t.dict
          case "$t" in http_*) dict=dicts/http.dict ;; esac
          args=""
          [ -f "$dict" ] && args="-dict=$dict"
          seeds=""
          [ -d "corpus/$t" ] && seeds="corpus/$t"
          echo "::group::smoke $t"
          # shellcheck disable=SC2086
          cargo +nightly fuzz run "$t" $seeds -- -max_total_time=10 -print_final_stats=1 $args
          echo "::endgroup::"
        done

    # Each feature alone proves the per-subsystem gates and dependency edges
    # (acl without shutil, idmap alone, …); `uring` alone proves the shared
    # engine builds severed from the net stack (the seam the async fs reactor
    # relies on); each net role alone proves the role gates, and `net-core`
    # alone proves the core they share builds with neither role present.
    #
    # Through clippy with `-D warnings`, not `cargo build`, because a warning
    # is only visible in the feature set that produces it: an item every other
    # build uses is dead code in the one subsystem that does not, and the
    # `--all-features` clippy above can never see it. `-D warnings` after `--`
    # binds to this crate alone, so a warning in a dependency is not our build
    # failure.
    #
    # `--all-targets`, because the tests and examples are where a feature gate
    # is most often missed and the only lane that built them was
    # `--all-features` - so `cargo test` at DEFAULT features did not compile
    # (an unregistered example reaching for `truenas_ros::http`) and nothing
    # here said so. It costs one compile per entry, same as before.
    - name: feature-matrix (deny warnings)
      run: |
        cargo clippy --no-default-features --all-targets -- -D warnings
        for f in sync-fs xattr mount acl fhandle fsiter idmap shutil \
                 configfile audit secrets signal uring net-core net-server \
                 net-client uring-fs http __fuzz; do
          echo "::group::clippy --features $f"
          cargo clippy --no-default-features --features "$f" \
            --all-targets -- -D warnings
          echo "::endgroup::"
        done
        # Pairs. An `any(a, b)` gate needs no pair - a single-feature build
        # already reaches each arm - so what wants one is an `all(a, b)`
        # gate, or an item whose guard is keyed on one feature while its
        # only caller sits behind another: in no other combination is the
        # guard inactive and the caller absent at once. The crate has
        # exactly one distinct `all(..)` feature pair today,
        # `all(net-server, uring-fs)`, at ~70 sites (the file-body path),
        # which is the first entry; `http,uring-fs` is the shape a consumer
        # ships. The remaining two are forward guards on the axes where an
        # `all(..)` would plausibly appear next. Add a pair here when a new
        # `all(..)` predicate does. Clippy stops at check, so each is one
        # compile, not a VM job.
        for p in net-server,uring-fs net-client,uring-fs \
                 net-server,net-client http,uring-fs; do
          echo "::group::clippy --features $p"
          cargo clippy --no-default-features --features "$p" \
            --all-targets -- -D warnings
          echo "::endgroup::"
        done
        cargo clippy --all-features -- -D warnings
        # A real build (clippy stops at check) of the shape everything ships.
        cargo build --all-features

    # `--no-deps` keeps RUSTDOCFLAGS off the dependencies, so `-D warnings`
    # here is this crate's own doc build: a link to an item the reader cannot
    # reach, a redundant target, broken markup.
    - name: docs (deny warnings)
      run: cargo doc --all-features --no-deps
      env:
        RUSTDOCFLAGS: "-D warnings"
