name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Some failures only ever reproduce on the runner, and a bare `panicked at
# file:line` with no frames is not enough to chase one from a log.
env:
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt + clippy + test (unprivileged)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The configparser differential tests spawn python3; guarantee it is present
    # so they run for real here rather than skipping.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup component add clippy rustfmt
        rustup default stable

    # `~/.cargo/bin` is in the cache for cargo-fuzz: installing it is a
    # from-source build of a whole binary, which would otherwise be the slowest
    # step in this job on every run.
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin
          target
          fuzz/target
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

    - name: rustfmt
      run: cargo fmt --all --check

    - name: clippy
      run: cargo clippy --all-features --all-targets -- -D warnings

    # The net (io_uring) tests skip themselves when a ring can't be created. We
    # do NOT want that to pass silently as green, so force them to run below —
    # but first fail fast and legibly if this runner has io_uring restricted,
    # so a red is clearly "runner can't do io_uring" and not a net-code bug.
    # (io_uring_disabled: 0 = on for everyone, 1 = unprivileged blocked, 2 =
    # off; an absent sysctl predates the knob and means io_uring is on.)
    - name: Verify io_uring is available
      run: |
        disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 0)
        if [ "$disabled" != "0" ]; then
          echo "::error::io_uring restricted on this runner (io_uring_disabled=$disabled); net tests cannot run here"
          exit 1
        fi
        echo "io_uring available (io_uring_disabled=$disabled)"
        echo "kernel=$(uname -r) uid=$(id -u) RLIMIT_MEMLOCK=$(ulimit -l) KiB"

    # The ZFS-backed and privileged tests skip automatically here (no datasets,
    # unprivileged); the QEMU VM job exercises them for real. Two otherwise-
    # silent skips are turned into hard failures: the configparser differential
    # tests (REQUIRE_PYTHON) and the net server/client tests (REQUIRE_IO_URING,
    # backed by the ring probe above that guarantees they can actually run).
    #
    # The kTLS data-path tests are deliberately NOT forced here: this runner's
    # kernel has the tls ULP, but Ubuntu builds OpenSSL 3.0 without
    # enable-ktls, so libssl can never install kTLS on a socket and the suites'
    # loopback engagement probe skips those tests. The QEMU job (Trixie
    # userspace, OpenSSL 3.2+ with ktls) sets TRUENAS_ROS_REQUIRE_KTLS=1 and
    # runs them for real.
    - name: test
      run: cargo test --all-features
      env:
        TRUENAS_ROS_REQUIRE_PYTHON: "1"
        TRUENAS_ROS_REQUIRE_IO_URING: "1"

    # The concurrency models are gated on `#[cfg(loom)]`: loom substitutes std's
    # atomics/locks/UnsafeCell with its own permutation-checking versions, so they
    # cannot ride along with the `cargo test` above — they need their own build
    # under `--cfg loom` and are invisible to every other step (including clippy).
    # Every model lives in a `loom_tests` module, so one name filter selects them
    # all. Each is deliberately tiny (loom is exhaustive, and its MAX_THREADS is 5
    # including the main thread); the heavier ones run under a preemption bound,
    # which their doc comments call out as making them bounded rather than
    # exhaustive proofs. cfg(loom) is registered in Cargo.toml's [lints.rust].
    #
    # Two invocations because the models span two feature sets: the SQ/CQ ring
    # model needs only the shared engine, the pool/offload/inject ones need the
    # fs reactor.
    - name: loom (concurrency models)
      run: |
        RUSTFLAGS="--cfg loom" cargo test --lib --features uring    loom_
        RUSTFLAGS="--cfg loom" cargo test --lib --features uring-fs loom_

    # The fuzz crate is self-rooted (its own workspace), so nothing above ever
    # compiles it — a target could bit-rot against an API change and no one would
    # know until someone ran a campaign by hand. Build every target, then replay
    # the checked-in seed corpora with `-runs=0`: a deterministic regression pass
    # over known-interesting inputs, no time budget, seconds to run. Finding *new*
    # bugs is a job for a real campaign, not for CI.
    - name: fuzz (build + replay seed corpora)
      run: |
        rustup toolchain install nightly --profile minimal
        command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
        cd fuzz
        cargo +nightly fuzz build
        for t in $(cargo +nightly fuzz list); do
          if [ -d "corpus/$t" ]; then
            echo "::group::replay $t"
            cargo +nightly fuzz run "$t" "corpus/$t" -- -runs=0
            echo "::endgroup::"
          else
            echo "::warning::no seed corpus for fuzz target $t"
          fi
        done

    # Each feature alone proves the per-subsystem gates and dependency edges
    # (acl without shutil, idmap alone, …); `uring` alone proves the shared
    # engine builds severed from the net stack (the seam the async fs reactor
    # relies on); each net role alone proves the role gates.
    - name: feature-matrix builds
      run: |
        cargo build --no-default-features
        for f in sync-fs xattr mount acl fhandle fsiter idmap shutil \
                 configfile audit uring net-server net-client uring-fs \
                 http __fuzz; do
          cargo build --no-default-features --features "$f"
        done
        cargo build --all-features

    - name: docs
      run: cargo doc --all-features --no-deps
