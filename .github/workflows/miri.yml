name: Miri

# The task executor's memory model, validated on every PR - the half loom
# cannot vouch for, since a loom green proves nothing (documented
# under-exploration) and x86's TSO hides weak-memory defects from every
# native run: the dedup edge's old `store(false, Release)` spelling was
# green over 200k native rounds and dies within a handful of Miri seeds.
#
# Miri is an interpreter, not a kernel: no syscall ever reaches one, and
# an unsupported foreign call ABORTS THE WHOLE BINARY rather than failing
# one test. That is why the run is filtered. It is filtered by exclusion
# rather than down to a single module, so the lane covers everything Miri
# can actually interpret; each exclusion is measured and carries its
# reason.
#
# Its own workflow rather than a step in `ci.yml`: it needs the nightly
# toolchain the main job deliberately avoids outside the fuzz build, it
# runs in parallel instead of lengthening the one `check` job, and a
# Miri red names itself in the PR's checks.

on:
  pull_request:
  push:
    branches: [ main, master ]

concurrency:
  group: miri-${{ github.head_ref || github.ref_name }}
  # PRs supersede themselves; a push to master must not, or a merged
  # commit can end up with no Miri result at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: "1"

  # Measured at dc95690, one module at a time, with each abort reason
  # recorded rather than inferred:
  #   uring_fs::core, uring_fs::host  - syscall 425 (io_uring_setup)
  #   uring_fs::broker                - TWO walls, and neither is well
  #                                     described by a syscall number;
  #                                     see the note below
  #   uring::ring                     - mmap with flags other than
  #                                     MAP_PRIVATE|MAP_ANONYMOUS
  #   uring_fs::query_dir::
  #   copy_range_tests, sync_fs::,
  #   tempdir::                       - foreign fn `mkdtemp`, which is the
  #                                     crate's own `tempdir()` helper
  #   clone3::                        - foreign fn `sigaction`
  #
  # **A skip is exactly as wide as its reason.** Two of these were not.
  #
  # `query_dir::` took the whole module for a `mkdtemp` only
  # `copy_range_tests::` performs - the other three test modules there
  # (`confinement_tests`, `order_tests`, `narrow_tests`) are pure and
  # miri-eligible, and one of them is the classifier the listing's
  # incompleteness rules are pinned by. Narrowed to the module that
  # actually calls it: 96 -> 110 tests, 0 failed, no abort, under both
  # aliasing models.
  #
  # The broker's reason was recorded as syscall 107 and "corrected" here
  # to 53 on the reasoning that 107 is `geteuid`, which Miri supports.
  # That correction was wrong, and its own lesson caught it: 107 was
  # right. Miri implements the `geteuid()` *function*, not the
  # `syscall()` dispatch for it, and `broker.rs`'s `raw_geteuid` calls
  # the raw form on purpose - "no glibc state in the loop, by
  # construction". Measured:
  #
  #   error: unsupported operation: syscall: unsupported syscall number 107
  #     --> src/uring_fs/broker.rs
  #      |  unsafe { libc::syscall(libc::SYS_geteuid) as u32 }
  #
  # And 53 is not a syscall wall either: Miri implements `socketpair`
  # and refuses the TYPE - "socketpair: type 0x5 is unsupported, only
  # SOCK_STREAM, SOCK_CLOEXEC and SOCK_NONBLOCK are allowed" - which is
  # the SEQPACKET the module's own diagram names as its first step.
  #
  # So the module has two walls, on different tests, and a syscall
  # number describes neither. It is also wider than both:
  # `the_group_fast_path_is_exactly_set_equality` interprets clean under
  # Miri today. Narrowing it needs a per-test skip list, which is a
  # maintenance trade rather than a correction, so it is not made here.
  #
  # The rule this was meant to serve still holds, and now has a second
  # instance behind it: a wrong reason sends the next person narrowing
  # at the wrong place. Measure the wall, do not infer it from a name.
  #
  # `-Zmiri-disable-isolation` does NOT recover the `mkdtemp` group:
  # `mkdtemp` is unimplemented in Miri, not merely isolated - measured, 0
  # of those tests recovered. Teaching `tempdir()` a Miri path is the only
  # lever that would, and that is a crate change, not a CI one.
  #
  # It DOES recover a different blocker, which is why the http step below
  # exists: `http::protocol` fails with "`clock_gettime` with `REALTIME`
  # clocks not available when isolation is enabled" and passes with the
  # flag. Unimplemented and isolation-gated are two different walls; only
  # the second one this flag moves.
  MIRI_SKIP: >-
    --skip uring_fs::core::
    --skip uring_fs::host::
    --skip uring_fs::broker::
    --skip uring_fs::query_dir::copy_range_tests::
    --skip uring::ring::
    --skip sync_fs::
    --skip tempdir::
    --skip clone3::

  # Exact, not a lower bound, on the loom lane's lesson: a libtest filter
  # that matches nothing exits 0, so a renamed module, a moved test or a
  # deleted one would otherwise read as a green lane. The shipped floor of
  # 10 against 81 running left 71 able to vanish silently.
  #
  # Read this as a count of tests MATCHED, not of tests that did work.
  # Most of `uring_fs::task` is ring-dependent and returns vacuously
  # under `cfg(miri)`. Measured by cross-referencing the filter's own
  # `--list` against the ring guards (`rig`, `engine_or_skip`):
  # lane-wide 95 matched, 55 vacuous, 40 executing; `uring_fs::task`
  # alone is 59 matched, 49 vacuous, 10 executing. So the shipped floor
  # of 10 was cleared by the vacuous skips ALONE: every meaningful test
  # could stop running and the lane would still pass. That is the
  # sharper reason this must be exact.
  #
  # And a bump is not coverage. The seven tests that took MIRI_TESTS
  # from 87 to 94 all enter through `rig()`, so they added 0 to the
  # executing count; the fraction moves only when a test that does not
  # need a ring is added. Re-measure with the two counts above rather
  # than inferring one from the other.
  #
  # It is also most of the value of widening the filter. Seven of the nine
  # modules added here have ZERO ring-guard uses - query_tree,
  # single_flight, offload_pool, user_data, sys, path::shape, errno - so
  # they genuinely execute, taking real coverage from ~9 tests to the
  # executing count above.
  # `uring::engine`'s 6 are guard-gated and will skip; they are counted
  # for the tripwire, not claimed as coverage.
  #
  # No libtest assertion can distinguish executed from vacuous. Making
  # the skips `#[ignore]` under `cfg(miri)` would, and would show up in
  # the `ignored` count - but that is a crate change, not a CI one.
  #
  # The cost is that adding a Miri-eligible test reddens this lane until
  # the number is bumped - deliberate, and the same trade the loom lane's
  # MODELS makes. (81 measured at dc95690; 85 covered the four Allow/
  # retraction tenancy tests added since; 86 added the mid-swap slot
  # bound; 87 the slot Refused transition table, pure Rc/RefCell state
  # that genuinely executes here; 91 adds the four ring-gated
  # refusal-delivery tests; 94 the `Allow` pair's tenancy in both
  # orderings and the retracted-timer verdict; 95 the single-flight
  # invalidate-during-mint control, which is plain map state behind
  # no guard and so the first bump since 87 to move the executing
  # count as well as the matched one; 96 the run-queue count's
  # nested-pass regression, ring-gated and so counted rather than
  # claimed; 110 is not a new test at all - it is the `query_dir::`
  # skip narrowed to its actual reason, which admits 14 that were
  # being skipped for a `mkdtemp` they never call; 111 adds the
  # sequential stop-screen test, pure channel state that genuinely
  # executes here; 112 adds the entry-open classifier's type table,
  # which is `matches!` over a `d_type` and a request behind no guard
  # at all, so it moves the executing count too.) If that friction is
  # unwanted,
  # `-lt` pinned at the TRUE count still catches deletion, which is
  # the failure mode; what it must not be again is a floor far below
  # what runs.
  MIRI_TESTS: "112"

  # The `http` band, run as its own step under its own feature set.
  # Exact for the same reason, and bumped by the same rule: 32 at the
  # step's measurement, 33 with the streaming-protocol connection
  # bound added beside the codec, 35 with the two stage-contract tests
  # (a streaming connection's `Whole` deliveries, and an `End` park
  # redriven as itself) - both pure dispatch, so both execute here; 36
  # with the streaming builder's zero-cap refusal, likewise pure
  # construction.
  #
  # The filter is `http::protocol::`, not `http::`, so most of the codec
  # is outside this number: tests added under `http::chunked`,
  # `http::response`, `http::framer` or `http::head` do not move it and
  # are not covered by it. Four landed beside that zero-cap one and the
  # count went up by one - if a band over the whole codec is wanted, it
  # is a new step with its own measured count, not a wider filter on
  # this one.
  MIRI_HTTP_TESTS: "36"

jobs:
  miri:
    name: miri (aliasing, provenance, weak memory)
    runs-on: ubuntu-latest
    # The seed sweeps are the only unbounded steps; 20 minutes is ~8x the
    # measured whole-lane time, so a hang fails fast instead of burning
    # the six-hour default.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      run: rustup toolchain install nightly --profile minimal --component miri

    # The cache key carries the TOOLCHAIN COMMIT because the sysroot is
    # built for one exact nightly, and `nightly` rotates daily: a key over
    # Cargo.toml alone serves a sysroot built by a different compiler, so
    # the step rebuilds it every run while reporting a cache hit.
    - name: Toolchain stamp
      id: stamp
      run: |
        echo "v=$(rustc +nightly -Vv | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/miri
        key: miri-${{ runner.os }}-${{ steps.stamp.outputs.v }}-${{ hashFiles('**/Cargo.toml') }}

    # Two aliasing models, not one. Stacked Borrows and Tree Borrows accept
    # different programs, so running both is strictly more coverage than
    # either - and this module's only `unsafe` (`reach_in`) hands out a
    # `&mut`, which is exactly what the two disagree about. Both measured
    # green on all 81 at dc95690, 15s and 17s.
    - name: miri (stacked borrows, strict provenance, symbolic alignment)
      env:
        MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check
      run: |
        .github/workflows/scripts/counted-cargo-test.sh "$MIRI_TESTS" "miri stacked borrows" -- \
          cargo +nightly miri test --lib --no-default-features \
          --features uring-fs -- $MIRI_SKIP
    - name: miri (tree borrows)
      env:
        MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
      run: |
        .github/workflows/scripts/counted-cargo-test.sh "$MIRI_TESTS" "miri tree borrows" -- \
          cargo +nightly miri test --lib --no-default-features \
          --features uring-fs -- $MIRI_SKIP
    # A second feature set, because the filter above cannot reach it: the
    # `http` band's protocol tests are pure parsing - 0 ring-guard uses in
    # the file, so all of them genuinely execute rather than skipping
    # - and they need `-Zmiri-disable-isolation` for `clock_gettime`,
    # not for anything about the ring. Measured at 32: 32 passed in
    # 9s, and still 32 under tree borrows and strict provenance.
    #
    # The flag is confined to THIS step on purpose. The steps above stay
    # isolated so their weak-memory work is not sharing a host clock or
    # environment, and nothing in this step is a scheduling claim.
    - name: miri (http protocol band)
      env:
        MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-strict-provenance
      run: |
        .github/workflows/scripts/counted-cargo-test.sh "$MIRI_HTTP_TESTS" "miri http band" -- \
          cargo +nightly miri test --lib --no-default-features \
          --features http http::protocol::
    # The seed sweep, over the WHOLE task module rather than one probe.
    # Seeding one test explores that test's interleavings; seeding the
    # module explores every wake-protocol test's, and the defect this lane
    # exists for was found by a seed, not by a name. Measured: 16 seeds
    # across the module is 37s, against 8s for 16 seeds on one probe and
    # 29s for 64 on one probe - the module-wide sweep is the better buy at
    # nearly the same price.
    #
    # No count is asserted here on purpose: the seeds run as parallel
    # interpreters and their libtest lines interleave, so no line-shaped
    # assertion is reliable. Its exit code is the assertion, and the two
    # counted steps above already pin that the filter names real tests.
    - name: miri (many seeds, whole task module)
      env:
        MIRIFLAGS: -Zmiri-many-seeds=0..16 -Zmiri-strict-provenance
      run: |
        cargo +nightly miri test --lib --no-default-features \
          --features uring-fs uring_fs::task::

    # The named weak-memory probe. This is the one test whose failure has a
    # known meaning: the pre-`feb37b1` `store(false, Release)` spelling
    # dies here within 6 seeds while being green over 200k native rounds,
    # so the margin between 6 and the sweep's depth is the value of the
    # step. 64 seeds measured at 29s.
    #
    # TWO runs, and the split is load-bearing. `-Zmiri-many-seeds` prints
    # `Trying seed:` before it has matched anything, so a grep for it
    # passes even when the probe has been renamed away - measured, with a
    # deliberately wrong name: the sweep still "ran" and the step still
    # went green. Only a COUNTED single run pins that the name still names
    # a test, which is what the lane shipped and what this keeps; the
    # sweep then rides on its exit code, as before.
    - name: miri (the weak-memory probe, named)
      env:
        MIRIFLAGS: -Zmiri-strict-provenance
      run: |
        .github/workflows/scripts/counted-cargo-test.sh 1 "miri weak-memory probe" -- \
          cargo +nightly miri test --lib --no-default-features \
          --features uring-fs -- --exact \
          uring_fs::task::tests::miri_a_deduped_wake_publishes_what_it_wrote
    - name: miri (the weak-memory probe, deeply seeded)
      env:
        MIRIFLAGS: -Zmiri-many-seeds=0..64 -Zmiri-strict-provenance
      run: |
        probe=uring_fs::task::tests::miri_a_deduped_wake_publishes_what_it_wrote
        cargo +nightly miri test --lib --no-default-features \
          --features uring-fs -- --exact "$probe"
